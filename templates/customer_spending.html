```html
{% extends "base.html" %}

{% block content %}

<div class="page-container">

    <h2>Customer Spending</h2>

    <p>
        Spending summary for:
        <strong>{{ customer_name }}</strong>
    </p>


    <div class="dashboard">

        <div class="card">

            <h3>Total Orders</h3>

            <p>
                {{ order_count }}
            </p>

        </div>


        <div class="card">

            <h3>Total Spending</h3>

            <p>
                ₹{{ "%.2f"|format(total_spending) }}
            </p>

        </div>

    </div>


    <br>

    <a
        href="{{ url_for('customers') }}"
        class="cancel-button"
    >
        Back to Customers
    </a>

</div>

{% endblock %}
```
