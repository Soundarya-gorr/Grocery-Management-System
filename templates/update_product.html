{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Update Product</h2>

    <form
        action="{{ url_for(
            'update_product',
            product_id=product[0]
        ) }}"
        method="POST"
    >

        <label>Product ID</label>

        <input
            type="text"
            value="{{ product[0] }}"
            disabled
        >


        <label>Product Name</label>

        <input
            type="text"
            name="product_name"
            value="{{ product[1] }}"
            required
        >


        <label>Category</label>

        <input
            type="text"
            name="category"
            value="{{ product[2] }}"
            required
        >


        <label>Price</label>

        <input
            type="number"
            name="price"
            value="{{ product[3] }}"
            step="0.01"
            min="0"
            required
        >


        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            value="{{ product[4] }}"
            min="0"
            required
        >


        <div class="form-buttons">

            <button
                type="submit"
                class="save-button"
            >
                Update Product
            </button>

            <a
                href="{{ url_for('products') }}"
                class="cancel-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
