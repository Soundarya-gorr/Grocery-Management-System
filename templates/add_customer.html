```html
{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Add Customer</h2>

    <form
        action="{{ url_for('add_customer') }}"
        method="POST"
    >

        <label>
            Customer ID
        </label>

        <input
            type="number"
            name="customer_id"
            required
        >


        <label>
            Customer Name
        </label>

        <input
            type="text"
            name="customer_name"
            required
        >


        <label>
            Phone
        </label>

        <input
            type="text"
            name="phone"
            maxlength="15"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Address
        </label>

        <input
            type="text"
            name="address"
            required
        >


        <div class="form-buttons">

            <button
                type="submit"
                class="save-button"
            >
                Add Customer
            </button>


            <a
                href="{{ url_for('customers') }}"
                class="cancel-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
```
